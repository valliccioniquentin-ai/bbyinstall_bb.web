<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Burn Installer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
    // Téléchargement automatique du fichier
    window.onload = function() {
        const link = document.createElement("a");
        link.href = "LatestBurn.zip"; // fichier dans le même dossier
        link.download = "LatestBurn.zip";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
</script>

<p>Le téléchargement de Burn va démarrer automatiquement...</p>
</body>
</html>
