<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Burn — Installer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --accent: #e84040;
      --text: #dddddd;
      --muted: #444444;
      --dim: #222222;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: .35;
    }

    /* ── GRID LINES ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── GLOW ── */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,64,64,.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;  transform: translate(-50%, -50%) scale(1.08); }
    }

    /* ── LAYOUT ── */
    .center {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
    }

    /* ── LOGO ── */
    .logo {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -4px;
      color: #fff;
      line-height: 1;
      opacity: 0;
      transform: translateY(30px);
      animation: rise .8s cubic-bezier(.22,1,.36,1) .1s forwards;
    }
    .logo span {
      color: var(--accent);
    }

    /* ── TAG ── */
    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 10px;
      opacity: 0;
      animation: rise .6s cubic-bezier(.22,1,.36,1) .35s forwards;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--border), transparent);
      margin: 32px 0;
      opacity: 0;
      animation: rise .5s ease .55s forwards;
    }

    /* ── DOWNLOAD BOX ── */
    .dl-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: rise .7s cubic-bezier(.22,1,.36,1) .65s forwards;
      position: relative;
      overflow: hidden;
    }
    .dl-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,64,64,.5), transparent);
    }

    .dl-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .dl-file {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 20px;
    }
    .dl-file strong {
      color: #fff;
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      width: 280px;
      height: 3px;
      background: var(--dim);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto 14px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #ff8080);
      border-radius: 2px;
      animation: fill 1.8s cubic-bezier(.4,0,.2,1) 1s forwards;
    }
    @keyframes fill {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }

    .dl-status {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      min-height: 16px;
    }
    .dl-status.done {
      color: #5cb85c;
    }

    /* ── VERSION BADGE ── */
    .version {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 2px;
      margin-top: 28px;
      opacity: 0;
      animation: rise .4s ease 1.2s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<div class="center">
  <div class="logo">Burn<span>.</span></div>
  <div class="tag">Roblox Script Executor</div>

  <div class="divider"></div>

  <div class="dl-box">
    <div class="dl-title">Downloading</div>
    <div class="dl-file"><strong>BurnInstaller.exe</strong></div>
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="dl-status" id="status">Preparing download...</div>
  </div>

  <div class="version">v1.0 &nbsp;·&nbsp; Windows x64</div>
</div>

<script>
  // Auto-download on page load
  window.addEventListener('load', () => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = 'LatestBurn/BurnInstaller.exe';
      a.download = 'BurnInstaller.exe';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 800);

    // Status messages
    const status = document.getElementById('status');
    const messages = [
      { t: 800,  msg: 'Preparing download...' },
      { t: 1200, msg: 'Connecting to server...' },
      { t: 2000, msg: 'Downloading BurnInstaller.exe...' },
      { t: 2800, msg: 'Download started ✓', done: true },
    ];
    messages.forEach(({ t, msg, done }) => {
      setTimeout(() => {
        status.textContent = msg;
        if (done) status.classList.add('done');
      }, t);
    });
  });
</script>
</body>
</html>
